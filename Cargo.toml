[workspace]
members = [
    "crates/flowscope-core",
    "crates/flowscope-wasm",
    "crates/flowscope-cli",
    "crates/flowscope-export",
    "vendor/sqlparser",
]
resolver = "2"

[workspace.package]
version = "0.9.6"
authors = ["PondPilot Team"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pondpilot/flowscope"

[workspace.dependencies]
flowscope-core = { version = "0.9.6", path = "crates/flowscope-core", default-features = false }
flowscope-export = { version = "0.9.6", path = "crates/flowscope-export", default-features = false }
# FlowScope's publishable fork of upstream sqlparser 0.61.0.
sqlparser = { package = "flowscope-sqlparser", version = "0.9.6", path = "vendor/sqlparser" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
schemars = { version = "1.1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
